name: Build and Release

on:
    push:
        tags:
            - "v*"

env:
    REGISTRY: ghcr.io
    IMAGE: ghcr.io/probits-as/meeteasier

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            security-events: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Parse version from tag
              id: version
              run: |
                  TAG=${GITHUB_REF_NAME#v}
                  MAJOR=$(echo $TAG | cut -d. -f1)
                  MINOR=$(echo $TAG | cut -d. -f2)
                  PATCH=$(echo $TAG | cut -d. -f3)
                  echo "major=$MAJOR" >> $GITHUB_OUTPUT
                  echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
                  echo "patch=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
                  echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod

            - name: Run GoReleaser (GitHub Release, Changelog & Binaries)
              uses: goreleaser/goreleaser-action@v6
              with:
                  version: "~> v2"
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  no-cache: true
                  build-args: |
                      VERSION=${{ github.ref_name }}
                      COMMIT=${{ github.sha }}
                      DATE=${{ steps.version.outputs.date }}
                  tags: |
                      ${{ env.IMAGE }}:v${{ steps.version.outputs.major }}
                      ${{ env.IMAGE }}:v${{ steps.version.outputs.minor }}
                      ${{ env.IMAGE }}:v${{ steps.version.outputs.patch }}
                      ${{ env.IMAGE }}:${{ steps.version.outputs.major }}
                      ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}
                      ${{ env.IMAGE }}:${{ steps.version.outputs.patch }}
                      ${{ env.IMAGE }}:latest

            - name: Scan Docker image with Trivy (summary)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ${{ env.IMAGE }}:v${{ steps.version.outputs.patch }}
                  format: "table"
                  exit-code: "0"
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  severity: "CRITICAL,HIGH,MEDIUM"

            - name: Scan Docker image with Trivy (SARIF)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ${{ env.IMAGE }}:v${{ steps.version.outputs.patch }}
                  format: "sarif"
                  output: "trivy-results.sarif"
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  severity: "CRITICAL,HIGH"

            - name: Upload Trivy scan results to GitHub Security
              uses: github/codeql-action/upload-sarif@v4
              if: always()
              with:
                  sarif_file: "trivy-results.sarif"
