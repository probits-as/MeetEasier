name: Build and Push Docker Image

on:
    push:
        tags:
            - "v*"

env:
    REGISTRY: ghcr.io
    IMAGE: ghcr.io/probits-as/meeteasier

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Parse version from tag
              id: version
              run: |
                  TAG=${GITHUB_REF_NAME#v}
                  MAJOR=$(echo $TAG | cut -d. -f1)
                  MINOR=$(echo $TAG | cut -d. -f2)
                  PATCH=$(echo $TAG | cut -d. -f3)
                  echo "major=$MAJOR" >> $GITHUB_OUTPUT
                  echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
                  echo "patch=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  no-cache: true
                  tags: |
                      ${{ env.IMAGE }}:v${{ steps.version.outputs.major }}
                      ${{ env.IMAGE }}:v${{ steps.version.outputs.minor }}
                      ${{ env.IMAGE }}:v${{ steps.version.outputs.patch }}
                      ${{ env.IMAGE }}:${{ steps.version.outputs.major }}
                      ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}
                      ${{ env.IMAGE }}:${{ steps.version.outputs.patch }}
                      ${{ env.IMAGE }}:latest
