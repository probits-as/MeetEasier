name: Build and Push Docker Image

on:
    push:
        tags:
            - "v*"

env:
    REGISTRY: ghcr.io
    IMAGE: ghcr.io/probits-as/meeteasier

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Parse version from tag
              id: version
              run: |
                  TAG=${GITHUB_REF_NAME#v}
                  MAJOR=$(echo $TAG | cut -d. -f1)
                  MINOR=$(echo $TAG | cut -d. -f2)
                  PATCH=$(echo $TAG | cut -d. -f3)
                  echo "major=$MAJOR" >> $GITHUB_OUTPUT
                  echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT
                  echo "patch=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

            - name: Update package.json versions
              run: |
                  TAG=${GITHUB_REF_NAME#v}
                  npm version $TAG --no-git-tag-version
                  cd ui-react && npm version $TAG --no-git-tag-version

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  no-cache: true
                  tags: |
                      ${{ env.IMAGE }}:${{ steps.version.outputs.major }}
                      ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}
                      ${{ env.IMAGE }}:${{ steps.version.outputs.patch }}
                      ${{ env.IMAGE }}:latest
